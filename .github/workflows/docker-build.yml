name: Docker Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t timemanager-backend -f backend/Dockerfile backend
      - name: Build frontend Docker image
        run: docker build -t timemanager-frontend --build-arg REACT_APP_API_URL=/api -f frontend/Dockerfile frontend
