name: timemanager

services:
  postgres:
    image: postgres:15
    container_name: timemanager-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: timemanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d timemanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.24
    container_name: timemanager-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timemanager-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://admin:secret@postgres:5432/timemanager
      DB_SYNC: "true"
      JWT_SECRET: ${JWT_SECRET:-production_jwt_secret_key_change_me_now}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-production_jwt_refresh_secret_change_me}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    container_name: timemanager-frontend
    depends_on:
      - backend
    expose:
      - "80"

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timemanager-backend-dev
    profiles: ["dev"]
    command: npm run dev
    volumes:
      - ./backend/src:/app/src:cached
      - ./backend/tests:/app/tests:cached
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://admin:secret@postgres:5432/timemanager
      DB_SYNC: "true"
      JWT_SECRET: ${JWT_SECRET:-development_jwt_secret_key_minvalue32}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development_jwt_refresh_secret_minvalue32}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: timemanager-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:

